# ---------------------------------------------------------------------------
# InfraGuard AI - local environment (v0.2 - Authentication & Identity)
#
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose run --rm migrate       # apply DB migrations (creates `users`)
#   docker compose run --rm bootstrap     # create the first Administrator
#                                         # (set BOOTSTRAP_ADMIN_* in .env first)
#   docker compose run --rm seed-demo     # load the curated demo dataset (idempotent)
#   docker compose run --rm sync-topology # project canonical relationships into Neo4j (idempotent)
#
# ---------------------------------------------------------------------------
# DATABASE SAFETY - read before touching volumes
# ---------------------------------------------------------------------------
#   `infraguard-ai_pgdata` and `infraguard-ai_neo4j_data` are PERSISTENT
#   development data. Treat both as user-owned.
#
#   SAFE:      docker compose down            (stops/removes containers, keeps data)
#              docker compose stop
#   FORBIDDEN: docker compose down -v         (DESTROYS pgdata/neo4j_data - never for dev)
#              docker volume rm infraguard-ai_pgdata / infraguard-ai_neo4j_data
#              docker volume prune / docker system prune --volumes
#
#   Regenerate demo data with `docker compose run --rm seed-demo` - NEVER by
#   resetting PostgreSQL. Destructive migration / integration testing uses the
#   throwaway `db-test` service (separate `pgdata_test` volume), never `db`:
#
#     docker compose --profile test up -d db-test
#
# Endpoints:
#   Frontend  -> http://localhost:3000       (/login, /register, /dashboard)
#   Backend   -> http://localhost:8000       (Swagger at /docs)
#   Liveness  -> http://localhost:8000/api/v1/health/live
#   Readiness -> http://localhost:8000/api/v1/health/ready
#
# Neo4j is a DERIVED graph projection, never the system of record (PostgreSQL
# `asset_relationships` is canonical - see backend/app/services/topology.py).
# Like `db`, it publishes no host port (backend-only, reached at `neo4j:7687`
# inside the `data` network). `docker compose up -d` starts it by default for
# a complete local stack, but nothing else in InfraGuard depends on it being
# healthy: relationship CRUD, the topology API and the rest of the platform
# work identically with Neo4j stopped, unreachable, or removed from this file
# entirely - see "Neo4j" in README.md for the exact fallback behavior.
#
# Network segmentation (least privilege):
#
#   Browser ──▶ frontend ──[edge]──▶ backend ──[data]──▶ db / neo4j
#
#   - frontend joins ONLY `edge`  -> it cannot reach PostgreSQL or Neo4j
#   - db, neo4j join ONLY `data`  -> internal, no outbound internet
#   - backend  joins BOTH         -> the only bridge between tiers
#   - migrate  joins ONLY `data`  -> one-shot; applies Alembic migrations
#
# PostgreSQL publishes no host port. Frontend/backend bind to 127.0.0.1 only.
# `${VAR:-default}` fallbacks are non-secret local-dev values so the stack also
# starts without a .env file. Setting ENVIRONMENT=production makes the backend
# reject these placeholder credentials / JWT secret at startup.
# ---------------------------------------------------------------------------

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Shared backend runtime configuration (used by `backend` and the `migrate` job).
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  POSTGRES_DB: ${POSTGRES_DB:-infraguard}
  POSTGRES_USER: ${POSTGRES_USER:-infraguard}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_development}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DATABASE_URL: ${DATABASE_URL:-}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
  # --- Authentication (v0.2) --- local-dev placeholder; rejected in production.
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
  # Fallback kept in step with the backend config default (app/core/config.py).
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  # Best-effort in-process auth rate limit. Defaults match app/core/config.py
  # (10 attempts / 60s). CI's sequential smoke suite makes a burst of *legitimate*
  # logins from a single Docker-gateway IP, so it raises the ceiling via env.
  AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  # --- Neo4j graph projection (Asset Relationships & Topology milestone) ---
  # A DERIVED projection only - PostgreSQL `asset_relationships` is canonical.
  # Points at the `neo4j` service below by default; unset NEO4J_URI (or stop /
  # remove that service) and every other part of InfraGuard - including
  # relationship CRUD and the topology API - keeps working unchanged.
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change_me_for_local_development}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  # --- Bootstrap Administrator (Governance Phase 3) ---
  # Consumed only by the one-shot `bootstrap` job below. Public registration
  # never creates an Administrator; this is the sole deterministic path.
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  db:
    <<: *hardening
    image: postgres:17.2-alpine@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infraguard}
      POSTGRES_USER: ${POSTGRES_USER:-infraguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_development}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop:
      - ALL
    cap_add:
      # Minimum set the official entrypoint needs to chown the data dir and
      # drop privileges from root to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infraguard} -d ${POSTGRES_DB:-infraguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  # DERIVED graph projection (Asset Relationships & Topology milestone) - see
  # backend/app/services/graph/. PostgreSQL `asset_relationships` remains
  # canonical; nothing else in this Compose file waits on this service being
  # healthy, and the backend degrades gracefully (typed "unavailable" /
  # "not_configured" status, no broken feature) if it is stopped or removed.
  neo4j:
    <<: *hardening
    image: neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change_me_for_local_development}
      # Community edition supports exactly one database - kept in step with
      # NEO4J_DATABASE in x-backend-env above.
      NEO4J_dbms_security_auth__minimum__password__length: "8"
    volumes:
      - neo4j_data:/data
    tmpfs:
      - /logs
      - /var/lib/neo4j/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  # One-shot: rebuild the Neo4j graph projection from canonical PostgreSQL
  # data. Idempotent (upsert + prune of InfraGuard-managed nodes/edges only).
  #   docker compose run --rm sync-topology
  sync-topology:
    <<: *hardening
    build:
      context: ./backend
    profiles: ["sync-topology"]
    restart: "no"
    command: ["python", "-m", "app.scripts.sync_topology"]
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  # One-shot: apply Alembic migrations, then exit. Never runs automatically.
  #   docker compose run --rm migrate
  migrate:
    <<: *hardening
    build:
      context: ./backend
    # Not started by `docker compose up`. Run explicitly:
    #   docker compose run --rm migrate
    profiles: ["migrate"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  # One-shot: create (or promote) the bootstrap Administrator, then exit.
  # Idempotent - safe to run repeatedly; never resets an existing password.
  # Requires BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD in `.env`.
  #   docker compose run --rm bootstrap
  bootstrap:
    <<: *hardening
    build:
      context: ./backend
    profiles: ["bootstrap"]
    restart: "no"
    command: ["python", "-m", "app.scripts.bootstrap_admin"]
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  # One-shot: INSERT the curated InfraGuard AI demo dataset into the normal
  # development database, then exit. Idempotent and strictly additive - it never
  # drops / truncates / resets anything and never touches user-created records,
  # users, passwords, roles or audit history. Regenerate demo data with THIS,
  # never by recreating PostgreSQL.
  #   docker compose run --rm seed-demo
  seed-demo:
    <<: *hardening
    build:
      context: ./backend
    profiles: ["seed-demo"]
    restart: "no"
    command: ["python", "-m", "app.scripts.seed_demo"]
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  # Throwaway PostgreSQL for destructive integration tests / migration
  # validation. SEPARATE volume (`pgdata_test`) and host port - it is never the
  # main `db`. `docker compose --profile test down -v` is safe here.
  #   docker compose --profile test up -d db-test
  db-test:
    <<: *hardening
    image: postgres:17.2-alpine@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
    profiles: ["test"]
    environment:
      POSTGRES_DB: infraguard_test
      POSTGRES_USER: ${POSTGRES_USER:-infraguard}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-infraguard_test_only}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infraguard} -d infraguard_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # A regular bridge (not the `internal` data net) so the host test runner can
    # reach it on 127.0.0.1:55433.
    networks:
      - testnet

  backend:
    <<: *hardening
    build:
      context: ./backend
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    depends_on:
      backend:
        # Backend healthcheck is liveness-only, so the frontend starts as soon
        # as the API process is up - even if PostgreSQL is unavailable.
        condition: service_healthy
    networks:
      - edge

volumes:
  pgdata:
  # Throwaway - only the `db-test` profile writes here. Safe to `down -v`.
  pgdata_test:
  # Persistent Neo4j graph projection - same safety rules as `pgdata`.
  neo4j_data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    # No route to the outside world: PostgreSQL has no reason to reach the internet.
    internal: true
  # Only the `test` profile's throwaway db-test uses this - a plain bridge so it
  # can publish a host port for the local test runner.
  testnet:
    driver: bridge
