name: CI

# Validation for InfraGuard AI: lint + unit/integration tests for both apps, and
# a Docker Compose build + migration + explicit bootstrap-admin + smoke test
# (health, authentication, the access-request approval flow, RBAC authorization,
# the assets API and the incidents API incl. their /summary endpoints, the audit
# log, and the Trash / restore soft-delete flow) of the documented delivery path.
#
# Out of scope (dedicated later phases): image publishing, deployment, Kubernetes,
# security scanning, release automation.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: infraguard_test
          POSTGRES_USER: infraguard
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraguard -d infraguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://infraguard:ci_test_only@localhost:5432/infraguard_test
      # The suite runs destructive schema ops; this disposable ephemeral CI
      # database is explicitly authorized for them (never a persistent volume).
      INFRAGUARD_DISPOSABLE_DB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (hash-pinned lock)
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Unit + integration tests
        run: pytest -m ""

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-smoke:
    name: Docker Compose (build + migrate + bootstrap + API smoke tests)
    runs-on: ubuntu-latest
    env:
      # Explicit first-Administrator bootstrap (Governance Phase 3). Public
      # registration never creates an Administrator - this is the only path.
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: a-ci-only-passphrase
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose config
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend liveness
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health/live >/dev/null && exit 0
            sleep 2
          done
          echo "backend did not become live"; exit 1

      - name: Apply database migrations
        run: docker compose run --rm migrate

      - name: Bootstrap the first Administrator (explicit + idempotent)
        run: |
          set -euo pipefail
          docker compose run --rm bootstrap
          # Running it again must be a safe no-op (no duplicate, no password reset).
          docker compose run --rm bootstrap

      - name: Verify backend readiness (expect 200)
        run: |
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/api/v1/health/ready)
          cat /tmp/ready.json; echo
          test "$code" = "200"

      - name: Access-request + RBAC authorization smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          ADMIN=/tmp/rbac-admin.txt
          VIEWER=/tmp/rbac-viewer.txt
          PW='a-ci-only-passphrase'

          echo "the bootstrapped Administrator can log in (never registered)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$ADMIN" -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$PW\"}" "$API/auth/login")" = "200"
          curl -s -b "$ADMIN" "$API/auth/me" | python3 -c "import sys,json; d=json.load(sys.stdin); assert [r['slug'] for r in d['roles']]==['administrator'], d['roles']; assert len(d['permissions'])==16, d['permissions']; assert d['account_status']=='active'"

          echo "public registration creates a PENDING access request (no roles, no access)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-request@example.com\",\"password\":\"$PW\"}" "$API/auth/register")" = "201"

          echo "a pending account cannot log in -> 403 account_pending"
          code=$(curl -s -o /tmp/pending.json -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-request@example.com\",\"password\":\"$PW\"}" "$API/auth/login")
          test "$code" = "403"
          python3 -c "import json; assert json.load(open('/tmp/pending.json'))['detail']['code']=='account_pending'"

          echo "duplicate registration -> 409 (status-neutral), incl. different casing / whitespace"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-request@example.com\",\"password\":\"$PW\"}" "$API/auth/register")" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"  CI-Request@Example.com \",\"password\":\"$PW\"}" "$API/auth/register")" = "409"

          echo "the request is listed under Administration -> Access Requests (no roles)"
          REQ_ID=$(curl -s -b "$ADMIN" "$API/admin/access-requests" | python3 -c "import sys,json; it=[u for u in json.load(sys.stdin)['items'] if u['email']=='ci-request@example.com'][0]; assert it['account_status']=='pending'; assert it['roles']==[]; print(it['id'])")

          echo "approving with zero roles is rejected (422)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X POST -d '{"role_ids":[]}' "$API/admin/users/$REQ_ID/approve")" = "422"

          VROLE=$(curl -s -b "$ADMIN" "$API/admin/roles" | python3 -c "import sys,json; print(next(r['id'] for r in json.load(sys.stdin)['items'] if r['slug']=='viewer'))")
          echo "approve as Viewer -> account becomes ACTIVE and can log in with exactly the Viewer permissions"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X POST -d "{\"role_ids\":[\"$VROLE\"]}" "$API/admin/users/$REQ_ID/approve")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$VIEWER" -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-request@example.com\",\"password\":\"$PW\"}" "$API/auth/login")" = "200"
          curl -s -b "$VIEWER" "$API/auth/me" | python3 -c "import sys,json; d=json.load(sys.stdin); assert sorted(d['permissions'])==['assets.read','incidents.read'], d['permissions']; assert d['account_status']=='active'"

          echo "viewer: can read, cannot mutate (403, never 401)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" "$API/assets")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" -H "$ORIGIN" -H "$CT" -d '{"name":"nope","asset_type":"Server","environment":"Test","criticality":"Low","status":"Operational"}' "$API/assets")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" "$API/audit")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" "$API/admin/users")" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/admin/users")" = "401"

          echo "reject flow: a second request -> REJECTED -> login denied with account_rejected"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-reject@example.com\",\"password\":\"$PW\"}" "$API/auth/register")" = "201"
          REJ_ID=$(curl -s -b "$ADMIN" "$API/admin/access-requests" | python3 -c "import sys,json; print([u for u in json.load(sys.stdin)['items'] if u['email']=='ci-reject@example.com'][0]['id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -X POST "$API/admin/users/$REJ_ID/reject")" = "200"
          code=$(curl -s -o /tmp/rej.json -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-reject@example.com\",\"password\":\"$PW\"}" "$API/auth/login")
          test "$code" = "403"
          python3 -c "import json; assert json.load(open('/tmp/rej.json'))['detail']['code']=='account_rejected'"

          echo "admin creates a custom role and grants it -> the affected action now succeeds"
          RID=$(curl -s -b "$ADMIN" -H "$ORIGIN" -H "$CT" -d '{"name":"CI Auditor","permissions":["audit.read"]}' "$API/admin/roles" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X PUT -d "{\"role_ids\":[\"$VROLE\",\"$RID\"]}" "$API/admin/users/$REQ_ID/roles")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" "$API/audit")" = "200"

          echo "the last active Administrator cannot lock themselves out (409)"
          AID=$(curl -s -b "$ADMIN" "$API/auth/me" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X PATCH -d '{"is_active":false}' "$API/admin/users/$AID")" = "409"

          echo "disabling a user stops their protected requests and their next login (account_disabled)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X PATCH -d '{"is_active":false}' "$API/admin/users/$REQ_ID")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$VIEWER" "$API/assets")" = "403"
          code=$(curl -s -o /tmp/dis.json -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-request@example.com\",\"password\":\"$PW\"}" "$API/auth/login")
          test "$code" = "403"
          python3 -c "import json; assert json.load(open('/tmp/dis.json'))['detail']['code']=='account_disabled'"

          echo "administrative changes are in the audit log"
          curl -s -b "$ADMIN" "$API/audit?entity_type=Role" | python3 -c "import sys,json; assert 'CREATE' in {e['action'] for e in json.load(sys.stdin)['items']}"
          curl -s -b "$ADMIN" "$API/audit?entity_type=User" | python3 -c "import sys,json; a={e['action'] for e in json.load(sys.stdin)['items']}; assert {'CREATE','UPDATE','STATUS_CHANGED'} <= a, a"

          echo "the four system roles are seeded and immutable"
          curl -s -b "$ADMIN" "$API/admin/roles" | python3 -c "import sys,json; s={r['slug'] for r in json.load(sys.stdin)['items'] if r['is_system']}; assert {'administrator','operator','analyst','viewer'} <= s, s"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -X DELETE "$API/admin/roles/$VROLE")" = "409"

      - name: Authentication smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          BASE=$API/auth
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/cookies.txt
          ADMIN=/tmp/auth-admin.txt
          PW='a-ci-only-passphrase'
          EMAIL="ci-$(date +%s)@example.com"
          BODY="{\"email\":\"$EMAIL\",\"password\":\"$PW\"}"

          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$ADMIN" -H "$ORIGIN" -H "$CT" -d "{\"email\":\"ci-admin@example.com\",\"password\":\"$PW\"}" "$BASE/login")" = "200"

          echo "register -> 201 (an access request, not a session)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/register")" = "201"

          echo "duplicate register -> 409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/register")" = "409"

          echo "login before approval -> 403 account_pending (no cookie)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/login")" = "403"
          ! grep -q infraguard_access "$JAR" 2>/dev/null

          echo "admin approves the request as Viewer"
          VROLE=$(curl -s -b "$ADMIN" "$API/admin/roles" | python3 -c "import sys,json; print(next(r['id'] for r in json.load(sys.stdin)['items'] if r['slug']=='viewer'))")
          ACCESS_REQUEST_USER_ID=$(curl -s -b "$ADMIN" "$API/admin/access-requests" | python3 -c "import sys,json; print([u for u in json.load(sys.stdin)['items'] if u['email']=='$EMAIL'][0]['id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$ADMIN" -H "$ORIGIN" -H "$CT" -X POST -d "{\"role_ids\":[\"$VROLE\"]}" "$API/admin/users/$ACCESS_REQUEST_USER_ID/approve")" = "200"

          echo "login -> 200 + cookie"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/login")" = "200"
          grep -q infraguard_access "$JAR"

          echo "me (authenticated) -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/me")" = "200"

          echo "bad login -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"$EMAIL\",\"password\":\"wrong\"}" "$BASE/login")" = "401"

          echo "cross-origin login -> 403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -H "$CT" -d "$BODY" "$BASE/login")" = "403"

          echo "logout -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -c "$JAR" -H "$ORIGIN" -X POST "$BASE/logout")" = "200"

          echo "me after logout -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/me")" = "401"

      - name: Assets smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/asset-cookies.txt
          # Re-use the bootstrapped Administrator (see the RBAC step); every
          # operation below needs a permission a fresh Viewer would not have.
          EMAIL="ci-admin@example.com"
          CREDS="{\"email\":\"$EMAIL\",\"password\":\"a-ci-only-passphrase\"}"

          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$CREDS" "$API/auth/login")" = "200"

          echo "unauthenticated list -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/assets")" = "401"

          echo "create asset -> 201"
          BODY='{"name":"ci-web-01","asset_type":"Server","environment":"Test","criticality":"Low","status":"Operational","ip_address":"10.0.0.5"}'
          ID=$(curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$API/assets" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test -n "$ID"

          echo "invalid enum -> 422"
          BAD='{"name":"x","asset_type":"Toaster","environment":"Test","criticality":"Low","status":"Operational"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$BAD" "$API/assets")" = "422"

          echo "list finds it via search -> total >= 1"
          curl -s -b "$JAR" "$API/assets?q=ci-web-01" | python3 -c "import sys,json; assert json.load(sys.stdin)['total'] >= 1"

          echo "multi-value status filter -> IN (...)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/assets?status=Degraded&status=Offline")" = "200"

          echo "summary (authenticated) -> shape + every catalog key"
          curl -s -b "$JAR" "$API/assets/summary" | python3 -c "import sys,json; d=json.load(sys.stdin); assert set(d)=={'total','active','inactive','by_criticality','by_status','by_environment','by_type'}; assert set(d['by_status'])=={'Operational','Degraded','Maintenance','Offline'}; assert d['total']>=1"

          echo "summary unauthenticated -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/assets/summary")" = "401"

          echo "get detail -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/assets/$ID")" = "200"

          echo "patch -> 200 and status changed"
          curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -X PATCH -d '{"status":"Degraded"}' "$API/assets/$ID" \
            | python3 -c "import sys,json; assert json.load(sys.stdin)['status'] == 'Degraded'"

          echo "deactivate -> is_active false"
          curl -s -b "$JAR" -H "$ORIGIN" -X POST "$API/assets/$ID/deactivate" \
            | python3 -c "import sys,json; assert json.load(sys.stdin)['is_active'] is False"

          echo "reactivate -> is_active true"
          curl -s -b "$JAR" -H "$ORIGIN" -X POST "$API/assets/$ID/reactivate" \
            | python3 -c "import sys,json; assert json.load(sys.stdin)['is_active'] is True"

          echo "missing asset -> 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/assets/11111111-1111-1111-1111-111111111111")" = "404"

      - name: Incidents smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/incident-cookies.txt
          # Re-use the bootstrapped Administrator (see the RBAC step); every
          # operation below needs a permission a fresh Viewer would not have.
          EMAIL="ci-admin@example.com"
          CREDS="{\"email\":\"$EMAIL\",\"password\":\"a-ci-only-passphrase\"}"

          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$CREDS" "$API/auth/login")" = "200"

          echo "unauthenticated list -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/incidents")" = "401"

          echo "create affected asset -> 201"
          ASSET='{"name":"ci-incident-asset","asset_type":"Database","environment":"Test","criticality":"High","status":"Operational"}'
          AID=$(curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$ASSET" "$API/assets" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "create incident (+ affected asset) -> 201 with CREATED + ASSET_ADDED timeline"
          BODY="{\"title\":\"ci checkout latency\",\"severity\":\"High\",\"priority\":\"P2\",\"asset_ids\":[\"$AID\"]}"
          IID=$(curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$API/incidents" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert [e['type'] for e in d['timeline']]==['CREATED','ASSET_ADDED']; assert len(d['affected_assets'])==1; print(d['id'])")
          test -n "$IID"

          echo "unknown affected asset -> 422"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -H "$CT" -d '{"title":"x","severity":"Low","priority":"P4","asset_ids":["11111111-1111-1111-1111-111111111111"]}' "$API/incidents")" = "422"

          echo "list finds it via search + affected_asset_count"
          curl -s -b "$JAR" "$API/incidents?q=checkout" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['total']>=1; assert d['items'][0]['affected_asset_count']==1"

          echo "filter by affected asset -> 200 total >= 1"
          curl -s -b "$JAR" "$API/incidents?asset_id=$AID" | python3 -c "import sys,json; assert json.load(sys.stdin)['total']>=1"

          echo "patch status -> STATUS_CHANGED event"
          curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -X PATCH -d '{"status":"Investigating"}' "$API/incidents/$IID" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='Investigating'; assert 'STATUS_CHANGED' in [e['type'] for e in d['timeline']]"

          echo "resolve -> Resolved + resolved_at + RESOLVED event"
          curl -s -b "$JAR" -H "$ORIGIN" -X POST "$API/incidents/$IID/resolve" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='Resolved'; assert d['resolved_at']; assert 'RESOLVED' in [e['type'] for e in d['timeline']]"

          echo "reopen -> Open + resolved_at cleared + REOPENED event"
          curl -s -b "$JAR" -H "$ORIGIN" -X POST "$API/incidents/$IID/reopen" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='Open'; assert d['resolved_at'] is None; assert 'REOPENED' in [e['type'] for e in d['timeline']]"

          echo "summary (authenticated) -> shape"
          curl -s -b "$JAR" "$API/incidents/summary" | python3 -c "import sys,json; d=json.load(sys.stdin); assert set(d)=={'total','open','critical_open','investigating','monitoring','resolved_recently','by_severity','by_status'}; assert d['total']>=1"

          echo "summary unauthenticated -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/incidents/summary")" = "401"

          echo "missing incident -> 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/incidents/11111111-1111-1111-1111-111111111111")" = "404"

      - name: Audit log smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/audit-cookies.txt
          # Re-use the bootstrapped Administrator (see the RBAC step); every
          # operation below needs a permission a fresh Viewer would not have.
          EMAIL="ci-admin@example.com"
          CREDS="{\"email\":\"$EMAIL\",\"password\":\"a-ci-only-passphrase\"}"

          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$CREDS" "$API/auth/login")" = "200"

          echo "unauthenticated audit list -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/audit")" = "401"

          echo "audit is append-only: no write verbs"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X POST "$API/audit")" = "405"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X DELETE "$API/audit/11111111-1111-1111-1111-111111111111")" = "405"

          echo "create + update an asset, then find both audit events"
          BODY='{"name":"ci-audit-db","asset_type":"Database","environment":"Test","criticality":"Low","status":"Operational"}'
          AID=$(curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$API/assets" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          curl -s -o /dev/null -b "$JAR" -H "$ORIGIN" -H "$CT" -X PATCH -d '{"status":"Degraded"}' "$API/assets/$AID"

          curl -s -b "$JAR" "$API/audit?entity_id=$AID" | python3 -c "import sys,json; d=json.load(sys.stdin); acts={e['action'] for e in d['items']}; assert {'CREATE','UPDATE'} <= acts, acts; assert all(e['entity_type']=='Asset' for e in d['items'])"

          echo "the UPDATE list row carries a bounded inline change_preview; detail has the full set"
          curl -s -b "$JAR" "$API/audit?entity_id=$AID&action=UPDATE" | python3 -c "import sys,json; e=json.load(sys.stdin)['items'][0]; p=e['change_preview']; assert 0 < len(p) <= 3; assert len(p) <= e['change_count']; assert {c['field_name'] for c in p} <= {'status'}"
          EID=$(curl -s -b "$JAR" "$API/audit?entity_id=$AID&action=UPDATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['items'][0]['id'])")
          curl -s -b "$JAR" "$API/audit/$EID" | python3 -c "import sys,json; d=json.load(sys.stdin); c={x['field_name']:(x['old_value'],x['new_value']) for x in d['changes']}; assert c['status']==('Operational','Degraded'), c; assert d['request_id']"

          echo "login wrote a LOGIN event with no field changes / preview and no secret"
          curl -s -b "$JAR" "$API/audit?action=LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); e=d['items'][0]; assert e['entity_type']=='Authentication'; assert e['change_count']==0; assert e['change_preview']==[]"
          curl -s -b "$JAR" "$API/audit?page_size=100" | python3 -c "import sys,json; t=sys.stdin.read().lower(); assert 'passphrase' not in t and 'password' not in t and 'bearer ' not in t"

          echo "summary (authenticated) -> shape"
          curl -s -b "$JAR" "$API/audit/summary" | python3 -c "import sys,json; d=json.load(sys.stdin); assert set(d)=={'events_today','changes_today','logins_today','active_actors_today'}; assert d['events_today']>=1"

          echo "summary unauthenticated -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/audit/summary")" = "401"

          echo "missing audit event -> 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/audit/11111111-1111-1111-1111-111111111111")" = "404"

      - name: Trash / restore smoke test
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/trash-cookies.txt
          # Re-use the bootstrapped Administrator (see the RBAC step); every
          # operation below needs a permission a fresh Viewer would not have.
          EMAIL="ci-admin@example.com"
          CREDS="{\"email\":\"$EMAIL\",\"password\":\"a-ci-only-passphrase\"}"

          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$CREDS" "$API/auth/login")" = "200"

          echo "unauthenticated trash list -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/trash/assets")" = "401"

          echo "create asset -> 201"
          BODY='{"name":"ci-trash-01","asset_type":"Server","environment":"Test","criticality":"Low","status":"Operational"}'
          ID=$(curl -s -b "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$API/assets" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test -n "$ID"

          echo "soft delete -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X DELETE "$API/assets/$ID")" = "200"

          echo "second delete -> 409 (already trashed)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X DELETE "$API/assets/$ID")" = "409"

          echo "normal detail -> 410 (in Trash, not 404)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/assets/$ID")" = "410"

          echo "normal list excludes it"
          curl -s -b "$JAR" "$API/assets?q=ci-trash-01" | python3 -c "import sys,json; assert json.load(sys.stdin)['total'] == 0"

          echo "trash list finds it with a deleter"
          curl -s -b "$JAR" "$API/trash/assets?q=ci-trash-01" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['total']==1; it=d['items'][0]; assert it['id']=='$ID'; assert it['deleted_at']; assert it['deleted_by_email']=='$EMAIL'"

          echo "trash summary counts it"
          curl -s -b "$JAR" "$API/trash/summary" | python3 -c "import sys,json; assert json.load(sys.stdin)['assets'] >= 1"

          echo "restore -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X POST "$API/trash/assets/$ID/restore")" = "200"

          echo "restore again -> 404 (no longer trashed)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -H "$ORIGIN" -X POST "$API/trash/assets/$ID/restore")" = "404"

          echo "normal detail works again -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$API/assets/$ID")" = "200"

          echo "audit trail carries DELETE + RESTORE for the asset"
          curl -s -b "$JAR" "$API/audit?entity_id=$ID" | python3 -c "import sys,json; acts={e['action'] for e in json.load(sys.stdin)['items']}; assert {'CREATE','DELETE','RESTORE'} <= acts, acts"

      # Runs LAST so the curated dataset never perturbs the precise assertions
      # above. This is a throwaway CI database, not the developer's volume.
      - name: Demo data seed smoke test (idempotent)
        run: |
          set -euo pipefail
          API=http://localhost:8000/api/v1
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/seed-cookies.txt
          CREDS='{"email":"ci-admin@example.com","password":"a-ci-only-passphrase"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$CREDS" "$API/auth/login")" = "200"

          echo "first seed run -> creates the curated dataset"
          docker compose run --rm seed-demo | tee /tmp/seed1.txt
          grep -Eq 'created: +[6-9][0-9]' /tmp/seed1.txt   # ~60-80 assets created

          A1=$(curl -s -b "$JAR" "$API/assets?page=1&page_size=1" | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])")
          I1=$(curl -s -b "$JAR" "$API/incidents?page=1&page_size=1" | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])")
          echo "assets(live)=$A1 incidents(live)=$I1"
          test "$A1" -gt 20 && test "$I1" -gt 15   # both modules need multiple pages
          curl -s -b "$JAR" "$API/assets/summary" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['by_criticality']['Critical']>0;assert sum(1 for v in d['by_environment'].values() if v)>=3"
          curl -s -b "$JAR" "$API/incidents/summary" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['open']>0;assert d['critical_open']>0"
          curl -s -b "$JAR" "$API/trash/summary" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['assets']>=3;assert d['incidents']>=2"
          curl -s -b "$JAR" "$API/admin/access-requests" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['total']>=3"

          echo "second seed run -> no duplicates, counts unchanged"
          docker compose run --rm seed-demo | tee /tmp/seed2.txt
          grep -q 'created: *0' /tmp/seed2.txt
          A2=$(curl -s -b "$JAR" "$API/assets?page=1&page_size=1" | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])")
          I2=$(curl -s -b "$JAR" "$API/incidents?page=1&page_size=1" | python3 -c "import sys,json;print(json.load(sys.stdin)['total'])")
          test "$A1" = "$A2" && test "$I1" = "$I2"

      - name: Verify frontend (expect exactly 200)
        run: |
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz || true)" = "200" ] && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/assets)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/incidents)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/incidents/new)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/audit)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/trash)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/trash?type=incidents')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/admin?tab=roles')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dashboard)" = "200"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
