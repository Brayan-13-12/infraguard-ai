name: CI

# Bootstrap validation for InfraGuard AI v0.1: lint + tests for both apps, and a
# Docker Compose build + smoke test of the documented delivery path.
#
# Out of scope for v0.1 (dedicated later phases): image publishing, deployment,
# Kubernetes, security scanning, release automation.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (hash-pinned lock)
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-smoke:
    name: Docker Compose (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose config
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend liveness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/live >/dev/null; then
              echo "backend is live"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become live"; exit 1

      - name: Verify backend readiness (expect 200)
        run: |
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/api/v1/health/ready)
          cat /tmp/ready.json; echo
          test "$code" = "200"

      - name: Verify frontend liveness (expect exactly 200)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz || true)
            if [ "$code" = "200" ]; then echo "frontend healthz 200"; break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
