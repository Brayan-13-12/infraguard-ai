name: CI

# Validation for InfraGuard AI: lint + unit/integration tests for both apps, and
# a Docker Compose build + migration + smoke test (health and authentication) of
# the documented delivery path.
#
# Out of scope (dedicated later phases): image publishing, deployment, Kubernetes,
# security scanning, release automation.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: infraguard_test
          POSTGRES_USER: infraguard
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraguard -d infraguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://infraguard:ci_test_only@localhost:5432/infraguard_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (hash-pinned lock)
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Unit + integration tests
        run: pytest -m ""

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-smoke:
    name: Docker Compose (build + migrate + auth smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose config
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend liveness
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health/live >/dev/null && exit 0
            sleep 2
          done
          echo "backend did not become live"; exit 1

      - name: Apply database migrations
        run: docker compose run --rm migrate

      - name: Verify backend readiness (expect 200)
        run: |
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/api/v1/health/ready)
          cat /tmp/ready.json; echo
          test "$code" = "200"

      - name: Authentication smoke test
        run: |
          set -euo pipefail
          BASE=http://localhost:8000/api/v1/auth
          ORIGIN='Origin: http://localhost:3000'
          CT='Content-Type: application/json'
          JAR=/tmp/cookies.txt
          EMAIL="ci-$(date +%s)@example.com"
          BODY="{\"email\":\"$EMAIL\",\"password\":\"a-ci-only-passphrase\"}"

          echo "register -> 201"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/register")" = "201"

          echo "duplicate register -> 409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/register")" = "409"

          echo "login -> 200 + cookie"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -H "$ORIGIN" -H "$CT" -d "$BODY" "$BASE/login")" = "200"
          grep -q infraguard_access "$JAR"

          echo "me (authenticated) -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/me")" = "200"

          echo "bad login -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIGIN" -H "$CT" -d "{\"email\":\"$EMAIL\",\"password\":\"wrong\"}" "$BASE/login")" = "401"

          echo "cross-origin login -> 403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -H "$CT" -d "$BODY" "$BASE/login")" = "403"

          echo "logout -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -c "$JAR" -H "$ORIGIN" -X POST "$BASE/logout")" = "200"

          echo "me after logout -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/me")" = "401"

      - name: Verify frontend (expect exactly 200)
        run: |
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz || true)" = "200" ] && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
