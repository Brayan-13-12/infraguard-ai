[project]
name = "infraguard-api"
version = "0.2.0"
description = "InfraGuard AI - backend API (v0.2 authentication & identity)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Abstract (top-level) dependencies. The exact, fully-resolved and hash-pinned
# set lives in requirements.txt / requirements-dev.txt (generated by pip-compile).
# See "Dependency management" in backend/README.md.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    # --- v0.2 authentication ---
    "pyjwt==2.13.0",          # JWT encode/decode (well maintained, minimal surface)
    "argon2-cffi==25.1.0",    # Argon2id password hashing (reference implementation)
    "email-validator==2.2.0", # backs pydantic EmailStr for RFC-compliant validation
    # --- Asset Relationships & Topology milestone ---
    "neo4j==5.28.1", # official Neo4j Python driver - the only Neo4j import in the codebase
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "pip-tools==7.6.1",
]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast unit tests run by default. Integration tests (real PostgreSQL) are
# opt-in: `pytest -m integration` or `pytest -m ""` to run everything.
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: exercises a real PostgreSQL database (skipped if unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injection idiom: `Depends()` in argument defaults.
"app/api/**" = ["B008"]
